spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/warehouse_test}
    username: ${TEST_DB_USERNAME:testuser}
    password: ${TEST_DB_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    clean-disabled: false
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
