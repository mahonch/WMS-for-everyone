# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse?sslmode=disable
spring.datasource.username=testuser
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === JWT ===
# === JWT ===
app.jwt.secret=super-secret-key-change-me-please-1234567890
app.jwt.access-ttl=3600000
# 60 minutes
app.jwt.refresh-ttl=1209600000
# 14 days



# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/products

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# ?????????? ????????? SQL (????????, ? ?? ?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ?????????? ????????? ????????? (????? ??? user_roles)
logging.level.org.hibernate.orm.jdbc.extract=TRACE
logging.level.org.hibernate.engine.internal.Collections=TRACE

# ?????????? dirty-checking (????? ???? ??????????)
logging.level.org.hibernate.engine.internal.StatefulPersistenceContext=TRACE

# ?????????? flush
logging.level.org.hibernate.event.internal.DefaultFlushEntityEventListener=TRACE

# ===============================
# DEVTOOLS - АВТО-РЕСТАРТ
# ===============================
# Исключения (не отслеживать изменения)
spring.devtools.restart.exclude=static/**,public/**

# Кэширование статики (отключено для dev)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ===============================
# GZIP СЖАТИЕ
# ===============================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

# ===============================
# КЭШИРОВАНИЕ СТАТИКИ
# ===============================
# В продакшене включить кэширование (30 дней)
spring.web.resources.cache.period=2592000
spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

