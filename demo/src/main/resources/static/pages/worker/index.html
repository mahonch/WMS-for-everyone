<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рабочее место</title>
    <link href="/css/app-v2.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .page { max-width: 960px; margin: 0 auto; padding: 20px; }
        .hero { background: linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:20px; border-radius:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
        .hero h1 { margin:0; font-size:24px; }
        .hero .muted { opacity:0.8; font-size:14px; }
        .badge-role { padding:6px 12px; border-radius:999px; background:rgba(255,255,255,0.18); font-weight:600; }
        .cards { display:grid; gap:16px; margin-top:16px; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:16px; box-shadow:0 6px 24px rgba(15,23,42,0.05); }
        .card h3 { margin:0 0 8px 0; font-size:16px; }
        .stat-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .stat { padding:12px; border:1px solid #eef0f5; border-radius:10px; background:#f8fafc; }
        .stat .value { font-size:20px; font-weight:700; }
        .stat .label { font-size:13px; color:#6b7280; }
        .btn-row { display:flex; flex-direction:column; gap:10px; }
        .btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; }
        .pill { padding:6px 12px; border-radius:999px; font-weight:600; }
        .pill.green { background:#e6f6ed; color:#166534; }
        .pill.gray { background:#f3f4f6; color:#374151; }
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <div>
                <div class="muted">Привет,</div>
                <h1 id="workerName">Загрузка...</h1>
                <div id="roleBadge" class="badge-role">—</div>
            </div>
            <div>
                <div id="shiftStatusBadge" class="pill gray">● Не на смене</div>
            </div>
        </section>

        <div class="cards">
            <div class="card">
                <h3>Статистика смены</h3>
                <div class="stat-grid">
                    <div class="stat">
                        <div class="value" id="statTasks">—</div>
                        <div class="label">Задач выполнено</div>
                    </div>
                    <div class="stat">
                        <div class="value" id="statTime">—</div>
                        <div class="label">Время на смене</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Управление сменой</h3>
                <button id="shiftActionBtn" class="btn btn-primary" style="width:100%;">Начать смену</button>
            </div>

            <div class="card">
                <h3>Действия</h3>
                <div class="btn-row">
                    <a href="tasks.html" class="btn btn-primary">📋 Мои задачи</a>
                    <button class="btn btn-secondary" onclick="generateTestOrder()">🧪 Создать тест. заказ</button>
                    <button class="btn btn-outline" onclick="window.location.href='/index.html'">🚪 Выйти</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/worker.js"></script>
</body>
</html>
