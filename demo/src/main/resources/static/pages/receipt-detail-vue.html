<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приёмка — WMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/css/app-v2.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">
    <style>
        [v-cloak] { display: none; }
        .page-container { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .info-label { color: #666; font-size: 12px; }
        .info-value { font-weight: 500; }
        .clickable-link { cursor: pointer; text-decoration: none; color: #1976D2; }
        .clickable-link:hover { text-decoration: underline; }
        .edit-input { max-width: 200px; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <v-app>
            <v-navigation-drawer v-model="drawer" app permanent class="no-print">
                <div class="d-flex align-center pa-4"><span class="text-h5 font-weight-bold">📦 WMS</span></div>
                <v-divider></v-divider>
                <v-list nav>
                    <v-list-item v-for="item in menuItems" :key="item.path" :to="item.path" :prepend-icon="item.icon" :title="item.title" rounded></v-list-item>
                </v-list>
                <template v-slot:append><v-list-item prepend-icon="mdi-logout" title="Выйти" @click="logout"></v-list-item></template>
            </v-navigation-drawer>

            <v-app-bar app elevation="1" class="no-print">
                <v-app-bar-nav-icon @click="drawer = !drawer"></v-app-bar-nav-icon>
                <v-app-bar-title>Приёмка №{{ receipt?.number || 'Загрузка...' }}</v-app-bar-title>
            </v-app-bar>

            <v-main>
                <v-container fluid class="page-container">
                    <v-breadcrumbs :items="breadcrumbs" class="pa-0 mb-4 no-print">
                        <template v-slot:divider><v-icon icon="mdi-chevron-right" size="small"></v-icon></template>
                    </v-breadcrumbs>

                    <!-- Loading -->
                    <v-card v-if="loading" class="pa-8 text-center">
                        <v-progress-circular color="primary" size="64" indeterminate></v-progress-circular>
                        <div class="mt-4">Загрузка документа...</div>
                    </v-card>

                    <!-- Error -->
                    <v-alert v-else-if="errorMsg" type="error" variant="tonal" class="ma-4">
                        <v-icon start icon="mdi-alert-circle"></v-icon> {{ errorMsg }}
                        <v-btn variant="text" @click="goBack" class="ml-4">Назад к списку</v-btn>
                    </v-alert>

                    <!-- Receipt Detail -->
                    <template v-else-if="receipt">
                        <!-- Header -->
                        <v-card class="mb-4">
                            <v-card-text class="pa-4">
                                <v-row align="center" justify="space-between">
                                    <v-col>
                                        <v-chip :color="receipt.status === 'COMMITTED' ? 'success' : 'warning'" variant="tonal">
                                            <v-icon start :icon="receipt.status === 'COMMITTED' ? 'mdi-check-circle' : 'mdi-clock-outline'"></v-icon>
                                            {{ receipt.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                        </v-chip>
                                    </v-col>
                                    <v-col cols="auto" class="no-print">
                                        <template v-if="receipt.status === 'DRAFT'">
                                            <v-btn color="success" prepend-icon="mdi-check" @click="commitReceipt" class="mr-2">Подписать</v-btn>
                                            <v-btn color="error" prepend-icon="mdi-delete" @click="deleteReceipt">Удалить</v-btn>
                                        </template>
                                        <v-btn variant="outlined" prepend-icon="mdi-printer" @click="printDocument" class="ml-2">Распечатать</v-btn>
                                        <v-btn variant="text" prepend-icon="mdi-arrow-left" @click="goBack">Назад</v-btn>
                                    </v-col>
                                </v-row>
                            </v-card-text>
                        </v-card>

                        <!-- Info Cards -->
                        <v-row class="mb-4">
                            <v-col cols="12" md="2">
                                <v-card variant="tonal" color="primary">
                                    <v-card-text>
                                        <div class="info-label">Номер</div>
                                        <div class="text-h6">{{ receipt.number }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="2">
                                <v-card variant="tonal" color="success">
                                    <v-card-text>
                                        <div class="info-label">Поставщик</div>
                                        <div class="text-h6">{{ receipt.supplierName || '—' }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="2">
                                <v-card variant="tonal" color="info">
                                    <v-card-text>
                                        <div class="info-label">Склад</div>
                                        <div class="text-h6">{{ receipt.warehouseName || '—' }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="2">
                                <v-card variant="tonal" color="warning">
                                    <v-card-text>
                                        <div class="info-label">Создал</div>
                                        <div class="text-body-2">{{ receipt.createdByName || '—' }}</div>
                                        <div class="info-label mt-1">{{ formatDate(receipt.createdAt) }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="2" v-if="receipt.committedAt">
                                <v-card variant="tonal" color="success">
                                    <v-card-text>
                                        <div class="info-label">Подписал</div>
                                        <div class="text-body-2">{{ receipt.committedByName || '—' }}</div>
                                        <div class="info-label mt-1">{{ formatDate(receipt.committedAt) }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                            <v-col cols="12" md="2">
                                <v-card variant="tonal" color="orange">
                                    <v-card-text>
                                        <div class="info-label">Сумма</div>
                                        <div class="text-h6">{{ formatMoney(totalAmount) }}</div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                        </v-row>

                        <!-- Items Table -->
                        <v-card>
                            <v-card-title class="d-flex align-center">
                                <v-icon icon="mdi-package-variant" class="mr-2"></v-icon>Позиции
                                <v-chip class="ml-2" color="primary" size="small">{{ receipt.items?.length || 0 }}</v-chip>
                                <v-spacer></v-spacer>
                                <v-btn v-if="receipt.status === 'DRAFT'" color="primary" size="small" prepend-icon="mdi-plus" @click="openProductDialog">Добавить товар</v-btn>
                            </v-card-title>
                            <v-card-text>
                                <v-table>
                                    <thead><tr><th>№</th><th>Товар</th><th>Артикул</th><th class="text-right">Кол-во</th><th class="text-right">Цена</th><th class="text-right">Сумма</th><th>Локация</th><th class="no-print"></th></tr></thead>
                                    <tbody>
                                        <tr v-for="(item, index) in receipt.items" :key="item.id">
                                            <td>{{ index + 1 }}</td>
                                            <td><a class="clickable-link" @click="goToProduct(item.productId)">{{ item.productName }}</a></td>
                                            <td><v-chip size="x-small" variant="outlined" class="clickable-link" @click="goToProduct(item.productId)">{{ item.productSku || '—' }}</v-chip></td>
                                            <td class="text-right">
                                                <template v-if="receipt.status === 'DRAFT'">
                                                    <v-text-field v-model.number="item.qty" type="number" min="1" density="compact" variant="outlined" hide-details class="edit-input mx-auto" @change="updateItem(item)"></v-text-field>
                                                </template>
                                                <template v-else><strong>{{ item.qty }}</strong></template>
                                            </td>
                                            <td class="text-right">
                                                <template v-if="receipt.status === 'DRAFT'">
                                                    <v-text-field v-model.number="item.price" type="number" min="0" step="0.01" density="compact" variant="outlined" hide-details class="edit-input mx-auto" @change="updateItem(item)"></v-text-field>
                                                </template>
                                                <template v-else>{{ formatMoney(item.price) }}</template>
                                            </td>
                                            <td class="text-right font-weight-bold">{{ formatMoney(item.qty * item.price) }}</td>
                                            <td>
                                                <template v-if="item.locationId">
                                                    <v-chip size="small" variant="tonal" color="info" class="clickable-link" @click="goToLocation(item.locationId)">
                                                        <v-icon start icon="mdi-map-marker" size="x-small"></v-icon>{{ item.locationName }}
                                                    </v-chip>
                                                </template>
                                                <template v-else><span class="text-grey">Не указана</span></template>
                                            </td>
                                            <td class="no-print">
                                                <template v-if="receipt.status === 'DRAFT'">
                                                    <v-btn icon="mdi-map-marker" size="x-small" variant="text" @click="openLocationSelect(item)"></v-btn>
                                                    <v-btn icon="mdi-delete" size="x-small" variant="text" color="error" @click="removeItem(item)"></v-btn>
                                                </template>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tfoot>
                                        <tr>
                                            <td colspan="5" class="text-right font-weight-bold">Итого:</td>
                                            <td class="text-right font-weight-bold text-primary">{{ formatMoney(totalAmount) }}</td>
                                            <td></td><td class="no-print"></td>
                                        </tr>
                                    </tfoot>
                                </v-table>
                                <v-alert v-if="!receipt.items || receipt.items.length === 0" type="info" variant="tonal" class="mt-4">
                                    Нет позиций. Нажмите "Добавить товар" для продолжения.
                                </v-alert>
                            </v-card-text>
                        </v-card>

                        <!-- Audit Info -->
                        <v-card class="mt-4" variant="outlined">
                            <v-card-title class="text-body-1"><v-icon icon="mdi-history" size="small" class="mr-2"></v-icon>Информация о документе</v-card-title>
                            <v-card-text>
                                <v-row>
                                    <v-col cols="6"><div class="info-label">Дата создания</div><div>{{ formatDate(receipt.createdAt) }}</div></v-col>
                                    <v-col cols="6"><div class="info-label">Создал</div><div>{{ receipt.createdByName || '—' }}</div></v-col>
                                    <v-col cols="6" v-if="receipt.committedAt"><div class="info-label">Дата подписания</div><div>{{ formatDate(receipt.committedAt) }}</div></v-col>
                                    <v-col cols="6" v-if="receipt.committedByName"><div class="info-label">Подписал</div><div>{{ receipt.committedByName }}</div></v-col>
                                </v-row>
                            </v-card-text>
                        </v-card>
                    </template>
                </v-container>
            </v-main>

            <!-- Location Select Dialog -->
            <v-dialog v-model="locationDialog" max-width="600">
                <v-card>
                    <v-card-title class="text-h5"><v-icon start icon="mdi-map-marker" class="mr-2"></v-icon>Выбрать локацию</v-card-title>
                    <v-card-text>
                        <v-select v-model="selectedLocation" :items="locations" item-title="code" item-value="id" return-object label="Ячейка хранения" variant="outlined" prepend-inner-icon="mdi-map-marker-radius">
                            <template v-slot:item="{ props, item }"><v-list-item v-bind="props" :title="item.raw.code + ' — ' + item.raw.name"></v-list-item></template>
                        </v-select>
                    </v-card-text>
                    <v-card-actions><v-spacer></v-spacer><v-btn variant="text" @click="locationDialog = false">Отмена</v-btn><v-btn color="primary" @click="saveLocation" :disabled="!selectedLocation">Сохранить</v-btn></v-card-actions>
                </v-card>
            </v-dialog>

            <!-- Product Select Dialog -->
            <v-dialog v-model="productDialog" max-width="900">
                <v-card>
                    <v-card-title class="text-h5"><v-icon start icon="mdi-package-variant" class="mr-2"></v-icon>Добавить товар</v-card-title>
                    <v-card-text>
                        <v-text-field v-model="productSearch" label="Поиск по названию или артикулу..." prepend-inner-icon="mdi-magnify" variant="outlined" density="compact" hide-details clearable @update:model-value="filterProducts"></v-text-field>
                        <v-data-table :headers="productHeaders" :items="filteredProducts" :loading="loadingProducts" hover density="compact" class="mt-3" @click:row="selectProduct">
                            <template v-slot:item.costPrice="{ item }">{{ formatMoney(item.costPrice) }}</template>
                            <template v-slot:item.actions="{ item }"><v-btn size="x-small" color="primary" @click.stop="selectProduct(null, item)">Добавить</v-btn></template>
                            <template v-slot:no-data><v-alert type="info" variant="tonal">Нет товаров</v-alert></template>
                        </v-data-table>
                    </v-card-text>
                    <v-card-actions><v-spacer></v-spacer><v-btn variant="text" @click="productDialog = false">Закрыть</v-btn></v-card-actions>
                </v-card>
            </v-dialog>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-demi@0.14.7/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinia@2.1.7/dist/pinia.iife.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.js"></script>
    <script src="/js/stores/receipts-store.js?v=7"></script>
    <script src="/js/services/receipt-service.js?v=7"></script>
    <script src="/js/vue-receipt-detail.js?v=7"></script>
</body>
</html>
