<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ячейка — WMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Vuetify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/css/app-v2.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">

    <style>
        [v-cloak] { display: none; }
        .page-container { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .info-label { color: #666; font-size: 12px; }
        .info-value { font-weight: 500; }
        .clickable-link { cursor: pointer; text-decoration: none; color: #1976D2; }
        .clickable-link:hover { text-decoration: underline; }
        @media print {
            .no-print { display: none !important; }
            .sidebar, .app-bar { display: none !important; }
            .page-container { padding: 0; max-width: 100%; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <v-app>
            <!-- Sidebar -->
            <v-navigation-drawer v-model="drawer" app permanent class="no-print">
                <div class="d-flex align-center pa-4">
                    <span class="text-h5 font-weight-bold">📦 WMS</span>
                </div>
                <v-divider></v-divider>
                <v-list nav>
                    <v-list-item
                        v-for="item in menuItems"
                        :key="item.path"
                        :to="item.path"
                        :prepend-icon="item.icon"
                        :title="item.title"
                        rounded
                    ></v-list-item>
                </v-list>
                <template v-slot:append>
                    <v-list-item prepend-icon="mdi-logout" title="Выйти" @click="logout"></v-list-item>
                </template>
            </v-navigation-drawer>

            <!-- Top App Bar -->
            <v-app-bar app elevation="1" class="app-bar no-print">
                <v-app-bar-nav-icon @click="drawer = !drawer"></v-app-bar-nav-icon>
                <v-app-bar-title>Ячейка {{ location?.code || 'Загрузка...' }}</v-app-bar-title>
            </v-app-bar>

            <!-- Main Content -->
            <v-main>
                <v-container fluid class="page-container">
                    <!-- Breadcrumbs -->
                    <v-breadcrumbs :items="breadcrumbs" class="pa-0 mb-4 no-print">
                        <template v-slot:divider>
                            <v-icon icon="mdi-chevron-right" size="small"></v-icon>
                        </template>
                    </v-breadcrumbs>

                    <!-- Loading -->
                    <v-card v-if="loading" class="pa-8 text-center">
                        <v-progress-circular color="primary" size="64" indeterminate></v-progress-circular>
                        <div class="mt-4 text-body-1">Загрузка ячейки...</div>
                    </v-card>

                    <!-- Location Detail -->
                    <template v-else-if="location">
                        <!-- Header Card -->
                        <v-card class="mb-4">
                            <v-card-text class="pa-4">
                                <v-row align="center" justify="space-between">
                                    <v-col>
                                        <div class="d-flex align-center gap-2">
                                            <v-chip color="info" variant="tonal">
                                                <v-icon start icon="mdi-map-marker"></v-icon>
                                                {{ location.type || 'BIN' }}
                                            </v-chip>
                                            <v-chip v-if="location.parentName" color="primary" variant="outlined" size="small">
                                                <v-icon start icon="mdi-folder"></v-icon>
                                                {{ location.parentName }}
                                            </v-chip>
                                        </div>
                                    </v-col>
                                    <v-col cols="auto" class="no-print">
                                        <v-btn variant="outlined" prepend-icon="mdi-printer" @click="printDocument">
                                            Распечатать
                                        </v-btn>
                                        <v-btn variant="text" prepend-icon="mdi-arrow-left" @click="goBack" class="ml-2">
                                            Назад
                                        </v-btn>
                                    </v-col>
                                </v-row>
                            </v-card-text>
                        </v-card>

                        <!-- Location Info -->
                        <v-row>
                            <!-- Основная информация -->
                            <v-col cols="12" md="8">
                                <v-card>
                                    <v-card-title class="text-h6">
                                        <v-icon icon="mdi-map-marker-radius" class="mr-2"></v-icon>
                                        Информация о ячейке
                                    </v-card-title>
                                    <v-card-text>
                                        <v-row>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Код</div>
                                                <div class="info-value text-h6">{{ location.code }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Название</div>
                                                <div class="info-value">{{ location.name }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Склад</div>
                                                <div class="info-value">
                                                    <a class="clickable-link" @click="goToWarehouse(location.warehouseId)">
                                                        {{ location.warehouseName || 'Склад #' + location.warehouseId }}
                                                    </a>
                                                </div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Тип</div>
                                                <div class="info-value">{{ location.type || 'BIN' }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6" v-if="location.parentName">
                                                <div class="info-label">Родительская ячейка</div>
                                                <div class="info-value">
                                                    <a v-if="location.parentId" class="clickable-link" @click="goToParentLocation(location.parentId)">
                                                        {{ location.parentName }}
                                                    </a>
                                                    <span v-else>—</span>
                                                </div>
                                            </v-col>
                                        </v-row>
                                    </v-card-text>
                                </v-card>
                            </v-col>

                            <!-- Статистика -->
                            <v-col cols="12" md="4">
                                <v-card variant="tonal" color="info">
                                    <v-card-title class="text-h6">
                                        <v-icon icon="mdi-chart-bar" class="mr-2"></v-icon>
                                        Статистика
                                    </v-card-title>
                                    <v-card-text>
                                        <div class="mb-3">
                                            <div class="info-label">Всего товаров</div>
                                            <div class="info-value text-h6">{{ location.totalProducts || 0 }}</div>
                                        </div>
                                        <div class="mb-3">
                                            <div class="info-label">Общее количество</div>
                                            <div class="info-value text-h6">{{ location.totalQty || 0 }} шт.</div>
                                        </div>
                                        <div>
                                            <div class="info-label">Общая стоимость</div>
                                            <div class="info-value text-h6 text-primary">{{ formatMoney(location.totalValue) }}</div>
                                        </div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                        </v-row>

                        <!-- Товары в ячейке -->
                        <v-card class="mt-4">
                            <v-card-title class="text-h6">
                                <v-icon icon="mdi-package-variant" class="mr-2"></v-icon>
                                Товары в ячейке
                                <v-chip class="ml-2" color="primary" size="small">{{ products.length }} шт.</v-chip>
                            </v-card-title>
                            <v-card-text>
                                <v-data-table
                                    :headers="productHeaders"
                                    :items="products"
                                    hover
                                    @click:row="goToProduct"
                                >
                                    <template v-slot:item.sku="{ item }">
                                        <v-chip size="x-small" variant="outlined">{{ item.sku }}</v-chip>
                                    </template>
                                    <template v-slot:item.name="{ item }">
                                        <a class="clickable-link">{{ item.name }}</a>
                                    </template>
                                    <template v-slot:item.costPrice="{ item }">
                                        {{ formatMoney(item.costPrice) }}
                                    </template>
                                    <template v-slot:item.quantity="{ item }">
                                        <strong>{{ item.quantity }}</strong>
                                    </template>
                                    <template v-slot:no-data>
                                        <v-alert type="info" variant="tonal">В ячейке нет товаров</v-alert>
                                    </template>
                                </v-data-table>
                            </v-card-text>
                        </v-card>

                        <!-- Связанные документы -->
                        <v-card class="mt-4">
                            <v-card-title class="text-h6">
                                <v-icon icon="mdi-history" class="mr-2"></v-icon>
                                Связанные документы
                            </v-card-title>
                            <v-card-text>
                                <v-tabs v-model="activeTab">
                                    <v-tab value="receipts">Приёмки</v-tab>
                                    <v-tab value="issues">Списания</v-tab>
                                    <v-tab value="transfers">Перемещения</v-tab>
                                </v-tabs>

                                <v-window v-model="activeTab" class="mt-4">
                                    <!-- Приёмки -->
                                    <v-window-item value="receipts">
                                        <v-data-table
                                            :headers="receiptHeaders"
                                            :items="relatedReceipts"
                                            :loading="loadingRelated"
                                            hover
                                            @click:row="goToReceipt"
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <a class="clickable-link">{{ item.number }}</a>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>

                                    <!-- Списания -->
                                    <v-window-item value="issues">
                                        <v-data-table
                                            :headers="issueHeaders"
                                            :items="relatedIssues"
                                            :loading="loadingRelated"
                                            hover
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <span>{{ item.number }}</span>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>

                                    <!-- Перемещения -->
                                    <v-window-item value="transfers">
                                        <v-data-table
                                            :headers="transferHeaders"
                                            :items="relatedTransfers"
                                            :loading="loadingRelated"
                                            hover
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <span>{{ item.number }}</span>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>
                                </v-window>
                            </v-card-text>
                        </v-card>
                    </template>

                    <!-- Error -->
                    <v-alert v-else type="error" variant="tonal" class="ma-4">
                        <v-icon start icon="mdi-alert-circle"></v-icon>
                        Ошибка загрузки ячейки
                    </v-alert>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <!-- Vue 3 + Vuetify -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-demi@0.14.7/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinia@2.1.7/dist/pinia.iife.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.js"></script>

    <!-- App -->
    <script src="/js/location-detail.js?v=1"></script>
</body>
</html>
