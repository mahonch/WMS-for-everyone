<!-- LOCATION EXPLORER - Двухпанельный проводник -->
<div id="locationExplorerOverlay" class="modal-overlay hidden">
    <div class="location-explorer-modal">
        <!-- Заголовок -->
        <div class="explorer-header">
            <div class="explorer-title">
                <h3> Выбор локации</h3>
                <button class="btn btn-secondary btn-sm" onclick="LocationExplorer.close()"></button>
            </div>
            
            <!-- Поиск -->
            <div class="explorer-search">
                <input id="locationExplorerSearch" 
                       class="input" 
                       placeholder=" Поиск по коду или названию..."
                       oninput="onLocationSearch()">
                <button class="btn btn-secondary" onclick="clearLocationSearch()"></button>
            </div>
        </div>

        <!-- Две панели -->
        <div class="explorer-body">
            <!-- Левая панель: Дерево -->
            <div class="explorer-panel explorer-tree-panel">
                <div class="panel-header">
                    <strong> Дерево склада</strong>
                    <span class="panel-hint">Навигация</span>
                </div>
                <div class="explorer-tree" id="locationTree">
                    <div class="empty-state">
                        <span class="empty-icon">⏳</span>
                        <div>Загрузка...</div>
                    </div>
                </div>
            </div>

            <!-- Правая панель: Контент -->
            <div class="explorer-panel explorer-content-panel">
                <div class="panel-header">
                    <strong> Содержимое</strong>
                    <span class="panel-hint" id="contentHint">Выберите узел</span>
                </div>
                <div class="explorer-content" id="locationContent">
                    <div class="empty-state">
                        <span class="empty-icon"></span>
                        <div class="empty-title">Выберите локацию</div>
                        <div class="empty-text">Кликните на элемент в дереве слева</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Результаты поиска (отдельная вкладка) -->
        <div class="explorer-search-results" id="searchResults" style="display: none;">
            <!-- Заполняется через JS -->
        </div>

        <!-- Подвал -->
        <div class="explorer-footer">
            <div class="selected-info" id="selectedInfo">
                <span class="selected-label">Выбрано:</span>
                <span class="selected-value" id="selectedLocation">—</span>
            </div>
            <div class="explorer-actions">
                <button class="btn btn-secondary" onclick="LocationExplorer.close()">Отмена</button>
                <button class="btn btn-primary" id="btnConfirmLocation" 
                        onclick="LocationExplorer.selectLocation(LocationExplorer.selectedNode?.id)"
                        disabled>
                     Выбрать
                </button>
            </div>
        </div>
    </div>
</div>
