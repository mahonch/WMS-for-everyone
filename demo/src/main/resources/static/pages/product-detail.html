<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Товар — WMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Vuetify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/css/app-v2.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">

    <style>
        [v-cloak] { display: none; }
        .page-container { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .info-label { color: #666; font-size: 12px; }
        .info-value { font-weight: 500; }
        .clickable-link { cursor: pointer; text-decoration: none; color: #1976D2; }
        .clickable-link:hover { text-decoration: underline; }
        .product-image { width: 200px; height: 200px; object-fit: cover; border-radius: 8px; }
        @media print {
            .no-print { display: none !important; }
            .sidebar, .app-bar { display: none !important; }
            .page-container { padding: 0; max-width: 100%; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <v-app>
            <!-- Sidebar -->
            <v-navigation-drawer v-model="drawer" app permanent class="no-print">
                <div class="d-flex align-center pa-4">
                    <span class="text-h5 font-weight-bold">📦 WMS</span>
                </div>
                <v-divider></v-divider>
                <v-list nav>
                    <v-list-item
                        v-for="item in menuItems"
                        :key="item.path"
                        :to="item.path"
                        :prepend-icon="item.icon"
                        :title="item.title"
                        rounded
                    ></v-list-item>
                </v-list>
                <template v-slot:append>
                    <v-list-item prepend-icon="mdi-logout" title="Выйти" @click="logout"></v-list-item>
                </template>
            </v-navigation-drawer>

            <!-- Top App Bar -->
            <v-app-bar app elevation="1" class="app-bar no-print">
                <v-app-bar-nav-icon @click="drawer = !drawer"></v-app-bar-nav-icon>
                <v-app-bar-title>{{ product?.name || 'Загрузка...' }}</v-app-bar-title>
            </v-app-bar>

            <!-- Main Content -->
            <v-main>
                <v-container fluid class="page-container">
                    <!-- Breadcrumbs -->
                    <v-breadcrumbs :items="breadcrumbs" class="pa-0 mb-4 no-print">
                        <template v-slot:divider>
                            <v-icon icon="mdi-chevron-right" size="small"></v-icon>
                        </template>
                    </v-breadcrumbs>

                    <!-- Loading -->
                    <v-card v-if="loading" class="pa-8 text-center">
                        <v-progress-circular color="primary" size="64" indeterminate></v-progress-circular>
                        <div class="mt-4 text-body-1">Загрузка товара...</div>
                    </v-card>

                    <!-- Product Detail -->
                    <template v-else-if="product">
                        <!-- Header Card -->
                        <v-card class="mb-4">
                            <v-card-text class="pa-4">
                                <v-row align="center" justify="space-between">
                                    <v-col>
                                        <div class="d-flex align-center gap-2">
                                            <v-chip
                                                :color="product.isActive ? 'success' : 'grey'"
                                                variant="tonal"
                                            >
                                                <v-icon start :icon="product.isActive ? 'mdi-check-circle' : 'mdi-cancel'"></v-icon>
                                                {{ product.isActive ? 'Активен' : 'Неактивен' }}
                                            </v-chip>
                                            <v-chip v-if="product.categoryName" color="primary" variant="outlined" size="small">
                                                <v-icon start icon="mdi-folder"></v-icon>
                                                {{ product.categoryName }}
                                            </v-chip>
                                        </div>
                                    </v-col>
                                    <v-col cols="auto" class="no-print">
                                        <v-btn variant="outlined" prepend-icon="mdi-printer" @click="printDocument">
                                            Распечатать
                                        </v-btn>
                                        <v-btn variant="text" prepend-icon="mdi-arrow-left" @click="goBack" class="ml-2">
                                            Назад
                                        </v-btn>
                                    </v-col>
                                </v-row>
                            </v-card-text>
                        </v-card>

                        <!-- Product Info -->
                        <v-row>
                            <!-- Основная информация -->
                            <v-col cols="12" md="8">
                                <v-card>
                                    <v-card-title class="text-h6">
                                        <v-icon icon="mdi-package-variant" class="mr-2"></v-icon>
                                        Информация о товаре
                                    </v-card-title>
                                    <v-card-text>
                                        <v-row>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Артикул (SKU)</div>
                                                <div class="info-value">{{ product.sku }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Штрих-код</div>
                                                <div class="info-value">{{ product.barcode || '—' }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Название</div>
                                                <div class="info-value text-h6">{{ product.name }}</div>
                                            </v-col>
                                            <v-col cols="12" md="6">
                                                <div class="info-label">Категория</div>
                                                <div class="info-value">
                                                    <a v-if="product.categoryId" class="clickable-link" @click="goToCategory(product.categoryId)">
                                                        {{ product.categoryName || 'Категория #' + product.categoryId }}
                                                    </a>
                                                    <span v-else>—</span>
                                                </div>
                                            </v-col>
                                            <v-col cols="12" md="4">
                                                <div class="info-label">Единица измерения</div>
                                                <div class="info-value">{{ product.unit }}</div>
                                            </v-col>
                                            <v-col cols="12" md="4">
                                                <div class="info-label">Мин. остаток</div>
                                                <div class="info-value">{{ product.minStock }} {{ product.unit }}</div>
                                            </v-col>
                                            <v-col cols="12" md="4">
                                                <div class="info-label">Цена</div>
                                                <div class="info-value text-primary text-h6">{{ formatMoney(product.costPrice) }}</div>
                                            </v-col>
                                        </v-row>

                                        <!-- Изображение -->
                                        <v-row v-if="product.imageUrl" class="mt-4">
                                            <v-col cols="12">
                                                <div class="info-label">Изображение</div>
                                                <img :src="product.imageUrl" :alt="product.name" class="product-image mt-2">
                                            </v-col>
                                        </v-row>
                                    </v-card-text>
                                </v-card>
                            </v-col>

                            <!-- Остатки на складах -->
                            <v-col cols="12" md="4">
                                <v-card variant="tonal" color="info">
                                    <v-card-title class="text-h6">
                                        <v-icon icon="mdi-warehouse" class="mr-2"></v-icon>
                                        Остатки
                                    </v-card-title>
                                    <v-card-text>
                                        <div v-if="stocks.length === 0" class="text-grey text-center pa-4">
                                            Нет остатков на складах
                                        </div>
                                        <div v-for="stock in stocks" :key="stock.id" class="mb-3">
                                            <div class="info-label">Склад</div>
                                            <div class="info-value">{{ stock.warehouseName || '—' }}</div>
                                            <div class="info-label mt-1">Локация</div>
                                            <a class="clickable-link" @click="goToLocation(stock.locationId)">
                                                {{ stock.locationCode || stock.locationName || '—' }}
                                            </a>
                                            <div class="info-label mt-1">Количество</div>
                                            <div class="info-value text-h6">{{ stock.quantity }} {{ product.unit }}</div>
                                        </div>
                                    </v-card-text>
                                </v-card>
                            </v-col>
                        </v-row>

                        <!-- Связанные документы -->
                        <v-card class="mt-4">
                            <v-card-title class="text-h6">
                                <v-icon icon="mdi-history" class="mr-2"></v-icon>
                                Связанные документы
                            </v-card-title>
                            <v-card-text>
                                <v-tabs v-model="activeTab">
                                    <v-tab value="receipts">Приёмки</v-tab>
                                    <v-tab value="issues">Списания</v-tab>
                                    <v-tab value="transfers">Перемещения</v-tab>
                                </v-tabs>

                                <v-window v-model="activeTab" class="mt-4">
                                    <!-- Приёмки -->
                                    <v-window-item value="receipts">
                                        <v-data-table
                                            :headers="receiptHeaders"
                                            :items="relatedReceipts"
                                            :loading="loadingRelated"
                                            hover
                                            @click:row="goToReceipt"
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <a class="clickable-link">{{ item.number }}</a>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:item.createdAt="{ item }">
                                                {{ formatDate(item.createdAt) }}
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>

                                    <!-- Списания -->
                                    <v-window-item value="issues">
                                        <v-data-table
                                            :headers="issueHeaders"
                                            :items="relatedIssues"
                                            :loading="loadingRelated"
                                            hover
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <span>{{ item.number }}</span>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:item.createdAt="{ item }">
                                                {{ formatDate(item.createdAt) }}
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>

                                    <!-- Перемещения -->
                                    <v-window-item value="transfers">
                                        <v-data-table
                                            :headers="transferHeaders"
                                            :items="relatedTransfers"
                                            :loading="loadingRelated"
                                            hover
                                        >
                                            <template v-slot:item.number="{ item }">
                                                <span>{{ item.number }}</span>
                                            </template>
                                            <template v-slot:item.status="{ item }">
                                                <v-chip
                                                    :color="item.status === 'COMMITTED' ? 'success' : 'warning'"
                                                    size="small"
                                                    variant="tonal"
                                                >
                                                    {{ item.status === 'COMMITTED' ? 'Подписана' : 'Черновик' }}
                                                </v-chip>
                                            </template>
                                            <template v-slot:no-data>
                                                <v-alert type="info" variant="tonal">Нет связанных документов</v-alert>
                                            </template>
                                        </v-data-table>
                                    </v-window-item>
                                </v-window>
                            </v-card-text>
                        </v-card>
                    </template>

                    <!-- Error -->
                    <v-alert v-else type="error" variant="tonal" class="ma-4">
                        <v-icon start icon="mdi-alert-circle"></v-icon>
                        Ошибка загрузки товара
                    </v-alert>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <!-- Vue 3 + Vuetify -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-demi@0.14.7/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinia@2.1.7/dist/pinia.iife.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.1/dist/vuetify.min.js"></script>

    <!-- App -->
    <script src="/js/product-detail.js?v=1"></script>
</body>
</html>
