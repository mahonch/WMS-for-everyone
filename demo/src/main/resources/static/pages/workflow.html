<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>WMS — Воркфлоу</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/app-v2.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">
    <script src="/js/auth-service.js"></script>
    <script src="/js/workflow.js?v=1"></script>
</head>
<body class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="logo">⚡ WMS</div>
    <nav>
        <a href="/dashboard.html">Главная</a>
        <a href="/pages/workflow.html" class="active">Воркфлоу</a>
        <a href="/pages/receipts.html">Приёмка</a>
        <a href="/pages/issues.html">Списание</a>
        <a href="/pages/transfers.html">Перемещения</a>
        <a href="/pages/products.html">Товары</a>
        <a href="/pages/warehouses.html">Склады</a>
        <a href="/pages/profile.html">Профиль</a>
        <a href="/scan.html">Скан QR</a>
    </nav>
    <div class="user-chip">
        <span id="usernameLabel">—</span>
        <button id="logoutBtn" class="btn btn-secondary">Выйти</button>
    </div>
</aside>

<!-- PAGE -->
<main class="content">
    <header class="topbar">
        <div>
            <div class="tag-muted">Управление</div>
            <strong>Воркфлоу задач</strong>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <select id="filterType" class="filter-select">
                <option value="">Все типы</option>
                <option value="RECEIPT">Приёмка</option>
                <option value="PICKING">Сборка</option>
                <option value="TRANSFER">Перемещение</option>
                <option value="INVENTORY">Инвентаризация</option>
            </select>
            <select id="filterWarehouse" class="filter-select">
                <option value="">Все склады</option>
            </select>
            <button class="btn btn-secondary" onclick="loadBoard()">🔄 Обновить</button>
        </div>
    </header>

    <div id="alerts"></div>

    <!-- СТАТИСТИКА -->
    <div class="wf-stats" id="wfStats">
        <div class="wf-stat" data-status="PENDING">
            <div class="wf-stat__num" id="statPending">0</div>
            <div class="wf-stat__label">Ожидают</div>
        </div>
        <div class="wf-stat" data-status="ASSIGNED">
            <div class="wf-stat__num" id="statAssigned">0</div>
            <div class="wf-stat__label">Назначены</div>
        </div>
        <div class="wf-stat" data-status="IN_PROGRESS">
            <div class="wf-stat__num" id="statInProgress">0</div>
            <div class="wf-stat__label">В работе</div>
        </div>
        <div class="wf-stat" data-status="COMPLETED">
            <div class="wf-stat__num" id="statCompleted">0</div>
            <div class="wf-stat__label">Завершены</div>
        </div>
    </div>

    <!-- KANBAN BOARD -->
    <div class="wf-board" id="wfBoard">
        <!-- COL: PENDING -->
        <div class="wf-column" data-status="PENDING">
            <div class="wf-column__header wf-column__header--pending">
                <span class="wf-column__icon">📋</span>
                <span>Ожидают</span>
                <span class="wf-column__count" id="countPending">0</span>
            </div>
            <div class="wf-column__body" id="colPending" data-status="PENDING"></div>
        </div>

        <!-- COL: ASSIGNED -->
        <div class="wf-column" data-status="ASSIGNED">
            <div class="wf-column__header wf-column__header--assigned">
                <span class="wf-column__icon">👤</span>
                <span>Назначены</span>
                <span class="wf-column__count" id="countAssigned">0</span>
            </div>
            <div class="wf-column__body" id="colAssigned" data-status="ASSIGNED"></div>
        </div>

        <!-- COL: IN_PROGRESS -->
        <div class="wf-column" data-status="IN_PROGRESS">
            <div class="wf-column__header wf-column__header--progress">
                <span class="wf-column__icon">⚙️</span>
                <span>В работе</span>
                <span class="wf-column__count" id="countInProgress">0</span>
            </div>
            <div class="wf-column__body" id="colInProgress" data-status="IN_PROGRESS"></div>
        </div>

        <!-- COL: COMPLETED -->
        <div class="wf-column" data-status="COMPLETED">
            <div class="wf-column__header wf-column__header--completed">
                <span class="wf-column__icon">✅</span>
                <span>Завершены</span>
                <span class="wf-column__count" id="countCompleted">0</span>
            </div>
            <div class="wf-column__body" id="colCompleted" data-status="COMPLETED"></div>
        </div>

        <!-- COL: CANCELLED -->
        <div class="wf-column" data-status="CANCELLED">
            <div class="wf-column__header wf-column__header--cancelled">
                <span class="wf-column__icon">❌</span>
                <span>Отменены</span>
                <span class="wf-column__count" id="countCancelled">0</span>
            </div>
            <div class="wf-column__body" id="colCancelled" data-status="CANCELLED"></div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="wf-modal-overlay" id="modalOverlay" style="display:none;">
        <div class="wf-modal" id="taskModal">
            <div class="wf-modal__header">
                <h3 id="modalTitle">Задача</h3>
                <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
            </div>
            <div class="wf-modal__body" id="modalBody"></div>
            <div class="wf-modal__footer" id="modalFooter"></div>
        </div>
    </div>
</main>

<style>
/* ===== FILTER SELECT ===== */
.filter-select {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: white;
    color: var(--text);
    cursor: pointer;
}
.filter-select:focus {
    outline: none;
    border-color: var(--primary);
}

/* ===== STATS BAR ===== */
.wf-stats {
    display: flex;
    gap: 16px;
    padding: 0 20px 16px;
    overflow-x: auto;
}
.wf-stat {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 16px 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    transition: transform 0.15s;
    cursor: pointer;
}
.wf-stat:hover { transform: translateY(-2px); }
.wf-stat__num {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
}
.wf-stat__label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}
.wf-stat[data-status="PENDING"] .wf-stat__num { color: #f59e0b; }
.wf-stat[data-status="ASSIGNED"] .wf-stat__num { color: #3b82f6; }
.wf-stat[data-status="IN_PROGRESS"] .wf-stat__num { color: #8b5cf6; }
.wf-stat[data-status="COMPLETED"] .wf-stat__num { color: #10b981; }

/* ===== KANBAN BOARD ===== */
.wf-board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    padding: 0 20px 20px;
    min-height: 60vh;
    overflow-x: auto;
}

.wf-column {
    background: #f1f2f6;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    min-width: 220px;
}

.wf-column__header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 14px;
    border-radius: 14px 14px 0 0;
}
.wf-column__header--pending  { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
.wf-column__header--assigned { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; }
.wf-column__header--progress { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #5b21b6; }
.wf-column__header--completed { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; }
.wf-column__header--cancelled { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; }

.wf-column__icon { font-size: 18px; }
.wf-column__count {
    margin-left: auto;
    background: rgba(255,255,255,0.5);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
}

.wf-column__body {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
    transition: background 0.2s;
    border-radius: 0 0 14px 14px;
}
.wf-column__body.drag-over {
    background: rgba(108, 92, 231, 0.12);
    box-shadow: inset 0 0 0 2px var(--primary);
}

/* ===== TASK CARD ===== */
.wf-card {
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: grab;
    transition: all 0.15s;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    position: relative;
}
.wf-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    transform: translateY(-2px);
    border-color: var(--primary);
}
.wf-card.dragging {
    opacity: 0.4;
    transform: rotate(2deg) scale(1.03);
}

.wf-card__top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.wf-card__number {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
}
.wf-card__type {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    color: white;
}
.type-RECEIPT   { background: #10b981; }
.type-PICKING   { background: #3b82f6; }
.type-TRANSFER  { background: #f59e0b; }
.type-INVENTORY { background: #8b5cf6; }

.wf-card__title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
}
.wf-card__meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
}
.wf-card__meta span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
}

.wf-card__progress {
    height: 4px;
    background: #e5e7eb;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
}
.wf-card__progress-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
}
.wf-card__progress-bar--low    { background: #ef4444; }
.wf-card__progress-bar--mid    { background: #f59e0b; }
.wf-card__progress-bar--high   { background: #10b981; }
.wf-card__progress-bar--full   { background: #6c5ce7; }

.wf-card__footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
}
.wf-card__assignee {
    display: flex;
    align-items: center;
    gap: 4px;
}
.wf-card__assignee-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
}
.wf-card__time {
    font-size: 10px;
    color: #aaa;
}

/* ===== EMPTY COLUMN ===== */
.wf-empty {
    text-align: center;
    padding: 30px 10px;
    color: #bbb;
    font-size: 13px;
}

/* ===== MODAL ===== */
.wf-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
}
.wf-modal {
    background: white;
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.wf-modal__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
}
.wf-modal__header h3 { margin: 0; font-size: 18px; }
.wf-modal__body {
    padding: 20px 24px;
}
.wf-modal__footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

/* DETAIL TABLE */
.wf-detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.wf-detail-table td {
    padding: 8px 0;
    border-bottom: 1px solid #f3f4f6;
}
.wf-detail-table td:first-child {
    color: var(--muted);
    width: 140px;
    font-weight: 500;
}

/* ITEMS TABLE */
.wf-items-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 12px;
}
.wf-items-table th {
    text-align: left;
    padding: 8px;
    background: #f8f9fa;
    font-weight: 600;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
}
.wf-items-table td {
    padding: 8px;
    border-bottom: 1px solid #f3f4f6;
}

/* TIMELINE */
.wf-timeline {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 16px 0;
    justify-content: center;
}
.wf-timeline__step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    z-index: 1;
}
.wf-timeline__dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border: 2px solid #ddd;
    background: white;
    color: #aaa;
    transition: all 0.2s;
}
.wf-timeline__dot--done {
    background: #10b981;
    border-color: #10b981;
    color: white;
}
.wf-timeline__dot--active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 0 0 4px rgba(108,92,231,0.2);
}
.wf-timeline__label {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
}
.wf-timeline__line {
    width: 40px;
    height: 2px;
    background: #ddd;
    margin-bottom: 18px;
}
.wf-timeline__line--done { background: #10b981; }

/* RESPONSIVE */
@media (max-width: 1200px) {
    .wf-board { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 800px) {
    .wf-board { grid-template-columns: repeat(2, 1fr); }
    .wf-stats { flex-wrap: wrap; }
    .wf-stat { min-width: calc(50% - 8px); }
}
@media (max-width: 500px) {
    .wf-board { grid-template-columns: 1fr; }
}
</style>

</body>
</html>
