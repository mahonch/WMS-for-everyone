<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ — пользователи</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/css/app-v2.css" rel="stylesheet">
    <link href="/css/mobile.css" rel="stylesheet">
    <script src="/js/auth-service.js"></script>
    <script src="/js/admin.js?v=3"></script>
</head>
<body class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="logo">WMS</div>
    <nav>
        <a href="/dashboard.html">Главная</a>
        <a href="/admin.html" class="active">Админ</a>
    </nav>
    <div class="user-chip">
        <span id="usernameLabel">—</span>
        <button id="logoutBtn" class="btn btn-secondary">Выйти</button>
    </div>
</aside>

<!-- PAGE -->
<main class="content">
    <header class="topbar">
        <div>
            <div class="tag-muted">Администрирование</div>
            <strong>Пользователи</strong>
        </div>
        <button class="btn btn-primary" id="btnOpenCreate">+ Новый пользователь</button>
    </header>

    <div id="alerts"></div>

    <!-- CREATE USER PANEL -->
    <section class="card" id="createPanel" style="display:none; margin: 20px;">
        <div class="section-title">
            <h3>Создать пользователя</h3>
            <button class="btn btn-secondary" id="btnCancelCreate">Отмена</button>
        </div>
        <form id="createForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 0;">
            <label>
                <span style="font-size: 13px; color: var(--muted);">Логин</span>
                <input id="c_username" required style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;">
            </label>
            <label>
                <span style="font-size: 13px; color: var(--muted);">Email</span>
                <input id="c_email" type="email" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;">
            </label>
            <label>
                <span style="font-size: 13px; color: var(--muted);">Пароль</span>
                <input id="c_password" type="password" required style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;">
            </label>
            <label>
                <span style="font-size: 13px; color: var(--muted);">Роль</span>
                <select id="c_role" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;">
                    <option value="ADMIN">ADMIN</option>
                    <option value="MANAGER">MANAGER</option>
                    <option value="STOREKEEPER">STOREKEEPER</option>
                    <option value="PICKER">PICKER</option>
                    <option value="GUEST">GUEST</option>
                </select>
            </label>
            <div style="grid-column: 1 / -1; display: flex; gap: 12px; margin-top: 8px;">
                <button class="btn btn-primary" type="submit">Создать</button>
                <button class="btn btn-secondary" type="button" id="btnCancelCreate2">Отмена</button>
            </div>
        </form>
    </section>

    <!-- ACTIVE USERS SECTION -->
    <section style="padding: 20px;">
        <div class="board-header board-header--active" style="margin-bottom: 16px;">
            <span>✅ Активные пользователи</span>
            <span id="activeCount" class="board-count">0</span>
        </div>
        <div id="activeUsers" class="board-list" data-status="active">
            <!-- Активные пользователи -->
        </div>
    </section>

    <!-- BLOCKED USERS SECTION -->
    <section style="padding: 20px; padding-top: 0;">
        <div class="board-header board-header--blocked" style="margin-bottom: 16px;">
            <span>🚫 Заблокированные пользователи</span>
            <span id="blockedCount" class="board-count">0</span>
        </div>
        <div id="blockedUsers" class="board-list" data-status="blocked">
            <!-- Заблокированные пользователи -->
        </div>
    </section>
</main>

<style>
/* BOARD STYLES */
.board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 16px;
}

.board-header--active {
    background: linear-gradient(135deg, #d4edda, #c3e6cb);
    color: #155724;
}

.board-header--blocked {
    background: linear-gradient(135deg, #f8d7da, #f5c6cb);
    color: #721c24;
}

.board-count {
    background: rgba(255,255,255,0.6);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 14px;
}

.board-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    padding: 16px;
    background: #f8f9fa;
    border-radius: 12px;
    min-height: 200px;
    transition: background 0.2s, box-shadow 0.2s;
}

.board-list.drag-over {
    background: rgba(0, 123, 255, 0.15);
    box-shadow: inset 0 0 0 3px #007bff;
}

/* USER CARD */
.user-card {
    background: white;
    border-radius: 10px;
    padding: 14px;
    cursor: grab;
    transition: all 0.2s;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
}

.user-card:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transform: translateY(-3px);
    border-color: #007bff;
}

.user-card.dragging {
    opacity: 0.4;
    cursor: grabbing;
    transform: rotate(2deg) scale(1.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.user-card__header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 10px;
}

.user-card__name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
}

.user-card__email {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-card__info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 8px 0;
    border-top: 1px solid #f0f0f0;
    border-bottom: 1px solid #f0f0f0;
}

.user-card__info-item {
    font-size: 11px;
    text-align: center;
}

.user-card__info-label {
    color: var(--muted);
    font-size: 10px;
    margin-bottom: 2px;
}

.user-card__actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
}

.user-card__actions .btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
}

.user-card__role {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    color: white;
    white-space: nowrap;
}

.role-ADMIN { background: #dc3545; }
.role-MANAGER { background: #0d6efd; }
.role-STOREKEEPER { background: #198754; }
.role-PICKER { background: #ff9800; }
.role-GUEST { background: #6c757d; }

/* DROP HINT */
.drop-hint {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
    border: 2px dashed var(--border);
    border-radius: 8px;
    background: rgba(255,255,255,0.5);
}

/* Responsive */
@media (max-width: 1400px) {
    .board-list {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 1100px) {
    .board-list {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 800px) {
    .board-list {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .board-list {
        grid-template-columns: 1fr;
    }
}
</style>

</body>
</html>
